version: '3.8'

services:
  scli-mysql:
    image: mysql:8.0
    container_name: scli-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "33061:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - scl-network-dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Moodle runs on Ubuntu LAMP stack, not Docker
  # scli-moodle-db and scli-moodle disabled
  # scli-moodle-db:
  #   image: bitnami/mariadb:latest
  #   container_name: scli-moodle-db-dev
  #
  # scli-moodle:
  #   image: bitnamilegacy/moodle:4.3
  #   container_name: scli-moodle-dev

  scli-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: scli-backend-dev
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DB_HOST=scli-mysql-dev
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - MOODLE_URL=http://localhost:9090
      - MOODLE_INTERNAL_URL=http://host.docker.internal:9090
      - MOODLE_TOKEN=e86dd021aaa42f78114e6c67cc9d8ff1
      - SSO_SECRET=${SSO_SECRET}
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      scli-mysql:
        condition: service_healthy
    networks:
      - scl-network-dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start

  scli-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scli-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_ENV=${VITE_ENV}
    depends_on:
      - scli-backend
    networks:
      - scl-network-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  scli-public-portal:
    build: ./public-portal
    container_name: scli-public-portal-dev
    ports:
      - "7777:7777"
    networks:
      - scl-network-dev
    volumes:
      - ./public-portal:/app
      - /app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

networks:
  scl-network-dev:
    driver: bridge

volumes:
  mysql_data_dev:
  moodle_db_data_dev:
  moodle_data_dev:
  moodledata_dev:
