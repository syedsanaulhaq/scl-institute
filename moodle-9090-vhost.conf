<VirtualHost *:9090>
    ServerName localhost
    ServerAlias 127.0.0.1

    DocumentRoot /var/www/moodle-9090

    <Directory /var/www/moodle-9090>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/moodle-9090_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle-9090_access.log combined

    # Security headers
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
</VirtualHost>

