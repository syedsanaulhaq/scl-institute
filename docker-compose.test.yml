version: '3.8'

# ===================================
# TESTING ENVIRONMENT
# Run: docker-compose -f docker-compose.test.yml --env-file .env.testing up --build
# Frontend  → http://localhost:3001
# Backend   → http://localhost:4001/api
# MySQL     → localhost:33062
# Portal    → http://localhost:7778
# ===================================

services:
  scli-mysql-test:
    image: mysql:8.0
    container_name: scli-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "33062:3306"
    volumes:
      - mysql_data_test:/var/lib/mysql
    networks:
      - scl-network-test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 20s

  scli-backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scli-backend-test
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=4001
      - DB_HOST=scli-mysql-test
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - MOODLE_URL=http://localhost:9090
      - MOODLE_INTERNAL_URL=http://host.docker.internal:9090
      - MOODLE_TOKEN=${MOODLE_TOKEN}
      - MOODLE_DATABASE_HOST=host.docker.internal
      - MOODLE_DATABASE_PORT=3306
      - MOODLE_DATABASE_USER=${MOODLE_DATABASE_USER}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DATABASE_PASSWORD}
      - MOODLE_DATABASE_NAME=${MOODLE_DATABASE_NAME}
      - SSO_SECRET=${SSO_SECRET}
      - VITE_API_URL=${VITE_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scli-mysql-test:
        condition: service_healthy
    networks:
      - scl-network-test
    # No volume mount — uses built image so local .env is not overlaid
    command: npm start

  scli-frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scli-frontend-test
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_ENV=${VITE_ENV}
    depends_on:
      - scli-backend-test
    networks:
      - scl-network-test
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Run Vite on 3001 inside container so Host header matches (avoids DNS-rebinding 404)
    command: npm run dev -- --port 3001

  scli-public-portal-test:
    build: ./public-portal
    container_name: scli-public-portal-test
    ports:
      - "7778:7777"
    networks:
      - scl-network-test
    volumes:
      - ./public-portal:/app
      - /app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

networks:
  scl-network-test:
    driver: bridge

volumes:
  mysql_data_test:
