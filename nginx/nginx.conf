
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;

    # Use Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ===================================================================
    # Production Environment - system.sclsandbox.xyz (Frontend + Backend API)
    # Simplified HTTP-only configuration
    # ===================================================================
    server {
        listen 80;
        server_name system.sclsandbox.xyz sclsandbox.xyz;

        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        # Backend API Proxy
        location /api/ {
            proxy_pass http://scli-backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_redirect off;
            proxy_pass_request_headers on;
        }

        # Frontend - React/Vite Application
        location / {
            set $upstream scli-frontend:3000;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_buffering off;
        }
    }

# Public Portal (student registration / apply)
    server {
        listen 80;
        server_name portal.sclsandbox.xyz;

        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        location / {
            set $portal_upstream scli-public-portal:7777;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # Optional: LMS domain proxy (simplified, no SSL required)
    server {
        listen 80;
        server_name lms.sclsandbox.xyz;

        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        # Forward to host Apache on port 8888
        location / {
            set $moodle_upstream http://172.18.0.1:8888;
            proxy_pass $moodle_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_redirect off;
        }
    }

    # ===================================================================
    # Production Environment - Localhost (for debugging)
    # ===================================================================
    server {
        listen 80 default_server;
        server_name localhost 127.0.0.1 _;

        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        # Backend API Proxy
        location /api/ {
            proxy_pass http://scli-backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_redirect off;
            proxy_pass_request_headers on;
        }

        # Frontend - React/Vite Application
        location / {
            set $upstream scli-frontend:3000;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}



