services:
  scli-mysql:
    image: mysql:8.0
    container_name: scli-mysql-prod
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - scl-network-prod
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scli-backend:
    image: scl-institute-scli-backend:latest
    container_name: scli-backend-prod
    restart: always
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=scli-mysql-prod
      - DB_PORT=3306
      - DB_USER=scl_user
      - DB_PASS=SclSecurePass2024!
      - DB_NAME=scl_institute
      - MOODLE_URL=http://185.211.6.60:8888
      - MOODLE_DATABASE_HOST=host.docker.internal
      - MOODLE_DATABASE_PORT=3306
      - MOODLE_DATABASE_USER=moodleuser
      - MOODLE_DATABASE_PASSWORD=moodlepass
      - MOODLE_DATABASE_NAME=moodle
      - SSO_SECRET=supersecretkey
      - VITE_API_URL=http://system.sclsandbox.xyz/api
    volumes:
      - ./backend:/app:cached
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scli-mysql:
        condition: service_healthy
    networks:
      - scl-network-prod
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/health" ]
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scli-frontend:
    image: scl-institute-scli-frontend:latest
    container_name: scli-frontend-prod
    restart: always
    env_file: .env.production
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_ENV=${VITE_ENV}
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    networks:
      - scl-network-prod
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000" ]
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scli-public-portal:
    build:
      context: ./public-portal
      dockerfile: Dockerfile.prod
    container_name: scli-public-portal-prod
    restart: always
    networks:
      - scl-network-prod
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:7777" ]
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scli-nginx:
    image: nginx:alpine
    container_name: scli-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - scli-frontend
      - scli-backend
      - scli-public-portal
    networks:
      - scl-network-prod
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/" ]
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  scl-network-prod:
    driver: bridge

volumes:
  mysql_data_prod:
    driver: local
