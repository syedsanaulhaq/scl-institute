version: '3.8'

services:
  scli-mysql:
    image: mysql:8.0
    container_name: scli-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: scl_institute
      MYSQL_USER: scl_user
      MYSQL_PASSWORD: scl_password
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - scl-network

  scli-moodle-db:
    image: bitnami/mariadb:latest
    container_name: scli-moodle-db
    environment:
      - MARIADB_ROOT_PASSWORD=moodleroot
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=bitnami_moodle_password
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - moodle_db_data:/var/lib/mysql
    networks:
      - scl-network

  scli-moodle:
    image: php:8.1-apache
    container_name: scli-moodle
    ports:
      - "9090:80"
    environment:
      - MOODLE_DATABASE_HOST=scli-moodle-db
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=bitnami_moodle_password
    restart: unless-stopped
    volumes:
      - moodle_data:/var/www/moodledata
      - ./moodle-config.php:/var/www/html/config.php
      - ./moodle-scripts/local/sclsso:/var/www/html/local/sclsso
    working_dir: /var/www/html
    entrypoint: >
      bash -c "
      apt-get update -qq &&
      apt-get install -y -qq mariadb-client libxml2-dev zlib1g-dev libpng-dev libjpeg-dev libfreetype6-dev libzip-dev curl unzip &&
      docker-php-ext-configure gd --with-freetype --with-jpeg &&
      docker-php-ext-install -j\$$(nproc) mysqli pdo_mysql gd xml zip >/dev/null 2>&1 &&
      a2enmod rewrite headers >/dev/null 2>&1 &&
      if [ ! -f /var/www/html/version.php ]; then
        echo 'Downloading Moodle 4.3...' &&
        curl -sSL https://moodle.org/downloads/download.php/direct/stable403/moodle-4.3.zip -o /tmp/moodle.zip &&
        unzip -q /tmp/moodle.zip -d /tmp &&
        mv /tmp/moodle/* /var/www/html/ &&
        rmdir /tmp/moodle &&
        rm /tmp/moodle.zip
      fi &&
      mkdir -p /var/www/moodledata &&
      chmod 777 /var/www/moodledata &&
      chown -R www-data:www-data /var/www &&
      echo 'Moodle setup complete' &&
      apache2-foreground
      "
    depends_on:
      - scli-moodle-db
    networks:
      - scl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login/index.php"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s

  scli-backend:
    build: ./backend
    container_name: scli-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=scli-mysql
      - DB_PORT=3306
      - DB_USER=scl_user
      - DB_PASS=scl_password
      - DB_NAME=scl_institute
      - MOODLE_URL=http://localhost:9090
      - SSO_SECRET=supersecretkey
    depends_on:
      - scli-mysql
    networks:
      - scl-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start

  scli-frontend:
    build: ./frontend
    container_name: scli-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - scli-backend
    networks:
      - scl-network
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  scli-public-portal:
    build: ./public-portal
    container_name: scli-public-portal
    ports:
      - "7777:7777"
    networks:
      - scl-network
    command: npm run dev
    volumes:
      - ./public-portal:/app
      - /app/node_modules

  scli-nginx:
    image: nginx:alpine
    container_name: scli-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - scli-frontend
      - scli-backend
      - scli-moodle
      - scli-public-portal
    networks:
      - scl-network

networks:
  scl-network:
    driver: bridge

volumes:
  mysql_data:
  moodle_db_data:
  moodle_data:
