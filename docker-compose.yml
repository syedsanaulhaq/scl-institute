version: '3.8'

services:
  # MySQL Database for SCL Application
  scli-mysql:
    image: mysql:8.0
    container_name: scli-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: scl_institute
      MYSQL_USER: scl_user
      MYSQL_PASSWORD: scl_password
    ports:
      - "33062:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - scl-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  scli-backend:
    build: ./backend
    container_name: scli-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=scli-mysql
      - DB_PORT=3306
      - DB_USER=scl_user
      - DB_PASS=scl_password
      - DB_NAME=scl_institute
      - MOODLE_DATABASE_HOST=wsl-host
      - MOODLE_DATABASE_PORT=3306
      - MOODLE_DATABASE_USER=moodleuser
      - MOODLE_DATABASE_PASSWORD=moodlepass
      - MOODLE_DATABASE_NAME=moodle
      - MOODLE_URL=http://localhost:9090/
      - SSO_SECRET=supersecretkey
    depends_on:
      scli-mysql:
        condition: service_healthy
    networks:
      - scl-network
    extra_hosts:
      - "wsl-host:host-gateway"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start

  # Frontend Application
  scli-frontend:
    build: ./frontend
    container_name: scli-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - scli-backend
    networks:
      - scl-network
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  scl-network:
    driver: bridge

volumes:
  mysql_data:
