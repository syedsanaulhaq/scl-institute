version: '3.8'

services:
  # MySQL Database for SCL Application
  scli-mysql:
    image: mysql:8.0
    container_name: scli-mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scl_institute}
      MYSQL_USER: ${MYSQL_USER:-scl_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scl_password}
    ports:
      - "33062:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - scl-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  scli-backend:
    build: ./backend
    container_name: scli-backend
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - PORT=4000
      - DB_HOST=scli-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-scl_user}
      - DB_PASS=${DB_PASS:-scl_password}
      - DB_NAME=${DB_NAME:-scl_institute}
      - MOODLE_URL=${MOODLE_URL:-http://localhost:9090/}
      - MOODLE_DATABASE_HOST=${MOODLE_DATABASE_HOST:-localhost}
      - MOODLE_DATABASE_PORT=${MOODLE_DATABASE_PORT_NUMBER:-3306}
      - MOODLE_DATABASE_USER=${MOODLE_DATABASE_USER:-moodleuser}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DATABASE_PASSWORD:-moodlepass}
      - MOODLE_DATABASE_NAME=${MOODLE_DATABASE_NAME:-moodle}
      - SSO_SECRET=${SSO_SECRET:-supersecretkey}
    depends_on:
      scli-mysql:
        condition: service_healthy
    networks:
      - scl-network
    extra_hosts:
      - "wsl-host:host-gateway"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start

  # Frontend Application
  scli-frontend:
    build: ./frontend
    container_name: scli-frontend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000/api}
    depends_on:
      - scli-backend
    networks:
      - scl-network
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # NGINX Reverse Proxy
  scli-nginx:
    image: nginx:alpine
    container_name: scli-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - scli-frontend
      - scli-backend
    networks:
      - scl-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  scl-network:
    driver: bridge

volumes:
  mysql_data:
